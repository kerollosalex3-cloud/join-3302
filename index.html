<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join – Anmelden</title>
    <script>
        if (new URLSearchParams(window.location.search).has("skipIntro")) {
            document.documentElement.classList.add("skip-logo-intro");
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="stylesheet" href="CSS/root.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body class="login-page">
    <header class="login-header">
        <img class="login-logo" src="assets/icons/logo.svg" alt="Join">
        <div class="register-prompt">
            <span class="register-prompt-text">Not a Join user?</span>
            <a class="register-link" href="html/register.html">Sign up</a>
        </div>
    </header>

    <main class="login-main">
        <section class="login-box">
            <h1 class="auth-title">Log in</h1>
            <form class="auth-form" novalidate>
                <label class="input-with-icon">
                    E-Mail
                    <input type="email" name="email" placeholder="E-Mail" autocomplete="username">
                    <img class="input-icon" src="assets/icons/mail.svg" alt="">
                    <small class="field-error" aria-live="polite"></small>
                </label>
                <label class="input-with-icon">
                    Passwort
                    <input type="password" name="password" placeholder="Passwort" autocomplete="current-password">
                    <img class="input-icon" src="assets/icons/lock.svg" alt="">
                    <small class="field-error" aria-live="polite"></small>
                </label>
                <div class="login-actions">
                    <button class="btn login-submit" type="submit">Log in</button>
                    <button class="btn secondary-btn guest-login" type="button">Guest Log in</button>
                </div>
            </form>

        </section>
    </main>

    <footer class="login-footer">
        <span>Privacy Policy</span>
        <span>Legal notice</span>
    </footer>
    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="scripts/login.js"></script>
</body>

</html>
