<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary-Join</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/logo.svg">
    <link rel="stylesheet" href="../CSS/root.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../CSS/summary.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a class="sidebar-logo" href="../index.html" aria-label="Join Startseite">
                <img src="../assets/icons/join-logo-white.svg" alt="Join">
            </a>
            <nav class="sidebar-nav" aria-label="Hauptnavigation">
                <a class="sidebar-link active" href="./summary.html" aria-current="page">
                    <img src="../assets/icons/summary.svg" alt="">
                    <span>Summary</span>
                </a>
                <a class="sidebar-link" href="./addTask.html">
                    <img src="../assets/icons/addTask.svg" alt="">
                    <span>Add Task</span>
                </a>
                <a class="sidebar-link" href="./board.html">
                    <img src="../assets/icons/board.svg" alt="">
                    <span>Board</span>
                </a>
                <a class="sidebar-link" href="./contacts.html">
                    <img src="../assets/icons/contact.svg" alt="">
                    <span>Contacts</span>
                </a>
            </nav>
            <div class="sidebar-legal">
                <a href="./privacy-policy.html">Privacy Policy</a>
                <a href="./legal-notice.html">Legal notice</a>
            </div>
        </aside>
        <div class="app-content">
            <header class="header">
                <p>Kanban Project Management Tool</p>
                <img src="../assets/icons/help.svg" alt="Help">
            </header>
            <main class="summary-main">
                <section class="summary-dashboard" aria-labelledby="summary-title">
                    <div class="summary-metrics">
                        <div class="summary-heading">
                            <h2 id="summary-title">Join 360</h2>
                            <p>Key Metrics at a Glance</p>
                        </div>
                        <div class="summary-top-cards">
                            <article class="summary-card">
                                <span class="metric-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="m4 17.25-.8 3.55 3.55-.8L19.6 7.15a2.1 2.1 0 0 0-2.97-2.97L4 17.25Z">
                                        </path>
                                        <path d="m14.9 5.9 3.2 3.2"></path>
                                    </svg>
                                </span>
                                <span class="summary-card-copy">
                                    <strong>1</strong>
                                    <span>To-do</span>
                                </span>
                            </article>
                            <article class="summary-card">
                                <span class="metric-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="m5 12.5 4.5 4.5L19 7"></path>
                                    </svg>
                                </span>
                                <span class="summary-card-copy">
                                    <strong>1</strong>
                                    <span>Done</span>
                                </span>
                            </article>
                        </div>
                        <article class="summary-card urgent-card">
                            <div class="urgent-metric">
                                <span class="metric-icon urgent-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="m5 14 7-6 7 6M5 20l7-6 7 6"></path>
                                    </svg>
                                </span>
                                <span class="summary-card-copy">
                                    <strong>1</strong>
                                    <span>Urgent</span>
                                </span>
                            </div>
                            <div class="upcoming-deadline">
                                <strong>October 16, 2022</strong>
                                <span>Upcoming Deadline</span>
                            </div>
                        </article>
                        <div class="summary-bottom-cards">
                            <article class="summary-card compact-card">
                                <strong>5</strong>
                                <span>Tasks in<br>Board</span>
                            </article>
                            <article class="summary-card compact-card">
                                <strong>2</strong>
                                <span>Tasks In<br>Progress</span>
                            </article>
                            <article class="summary-card compact-card">
                                <strong>2</strong>
                                <span>Awaiting<br>Feedback</span>
                            </article>
                        </div>
                    </div>
                    <div class="summary-greeting">
                        <p>Good morning,</p>
                        <h1>Sofia Müller</h1>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
