<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join – Anmelden</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="stylesheet" href="CSS/root.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body class="login-page">
    <header class="login-header">
        <img class="login-logo" src="assets/icons/logo.svg" alt="Join">
        <div class="register-prompt">
            <span class="register-prompt-text">Noch kein Konto?</span>
            <button class="register-link" type="button" aria-expanded="false">Registrieren</button>
        </div>
    </header>

    <main class="login-main">
        <section class="login-box">
            <h1 class="auth-title">Anmelden</h1>
            <p class="sr-only">Melde dich mit deinem Konto an oder nutze den Gastzugang.</p>

            <form class="auth-form login-form">
                <label class="input-with-icon">
                    E-Mail
                    <input type="email" name="email" placeholder="E-Mail" autocomplete="username" required>
                    <img class="input-icon" src="assets/icons/mail.svg" alt="">
                </label>
                <label class="input-with-icon">
                    Passwort
                    <input type="password" name="password" placeholder="Passwort" autocomplete="current-password" required>
                    <img class="input-icon" src="assets/icons/lock.svg" alt="">
                </label>
                <div class="login-actions">
                    <button class="btn login-submit" type="submit">Anmelden</button>
                    <button class="btn secondary-btn guest-login" type="button">Als Gast anmelden</button>
                </div>
            </form>

            <form class="auth-form register-form" hidden>
                <label>
                    Name
                    <input type="text" name="name" maxlength="40" placeholder="Name" autocomplete="name" required>
                </label>
                <label class="input-with-icon">
                    E-Mail
                    <input type="email" name="email" placeholder="E-Mail" autocomplete="email" required>
                    <img class="input-icon" src="assets/icons/mail.svg" alt="">
                </label>
                <label class="input-with-icon">
                    Passwort (mindestens 6 Zeichen)
                    <input type="password" name="password" minlength="6" placeholder="Passwort" autocomplete="new-password" required>
                    <img class="input-icon" src="assets/icons/lock.svg" alt="">
                </label>
                <button class="btn register-submit" type="submit">Konto erstellen</button>
            </form>
        </section>
    </main>

    <footer class="login-footer">
        <span>Datenschutz</span>
        <span>Impressum</span>
    </footer>
    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="scripts/login.js"></script>
</body>

</html>
