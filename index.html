<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join – Anmelden</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="stylesheet" href="CSS/root.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body class="login-page">
    <header class="login-header">
        <img class="login-logo" src="assets/icons/logo.svg" alt="Join">
        <div class="register-prompt">
            <span class="register-prompt-text">Not a Join User?</span>
            <a class="register-link" href="register.html">Registrieren</a>
        </div>
    </header>

    <main class="login-main">
        <section class="login-box">
            <h1 class="auth-title">Anmelden</h1>
            <form class="auth-form">
                <label class="input-with-icon">
                    E-Mail
                    <input type="email" name="email" placeholder="E-Mail" autocomplete="username" required>
                    <img class="input-icon" src="assets/icons/mail.svg" alt="">
                </label>
                <label class="input-with-icon">
                    Passwort
                    <input type="password" name="password" placeholder="Passwort" autocomplete="current-password"
                        required>
                    <img class="input-icon" src="assets/icons/lock.svg" alt="">
                </label>
                <div class="login-actions">
                    <button class="btn login-submit" type="submit">Anmelden</button>
                    <button class="btn secondary-btn guest-login" type="button">Als Gast anmelden</button>
                </div>
            </form>

        </section>
    </main>

    <footer class="login-footer">
        <span>Datenschutz</span>
        <span>Impressum</span>
    </footer>
    <div class="toast" role="status" aria-live="polite"></div>

</body>

</html>
