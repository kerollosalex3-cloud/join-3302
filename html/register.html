<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join – Registrieren</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/logo.svg" />
    <link rel="stylesheet" href="../CSS/root.css" />
    <link rel="stylesheet" href="../CSS/register.css" />
</head>

<body class="login-page register-page">
    <header class="login-header">
        <a href="../index.html" aria-label="Zur Anmeldung">
            <img class="login-logo" src="../assets/icons/logo.svg" alt="Join" />
        </a>
    </header>

    <main class="login-main">
        <section class="login-box">
            <div class="register-title-row">
                <a class="register-back-link" href="../index.html?skipIntro=1" aria-label="Zur Login-Seite">
                    <img src="../assets/icons/arrow-back.svg" alt="" />
                </a>
                <h1 class="auth-title">Sign up</h1>
            </div>

            <p class="sr-only">Erstelle ein neues Join-Konto.</p>

            <form id="register-form" class="auth-form" novalidate>
                <label class="input-with-icon">
                    <input id="register-name" type="text" name="name" placeholder="Name" autocomplete="name" />
                    <img class="input-icon" src="../assets/icons/person-signup.svg" alt="" />
                    <small class="field-error" aria-live="polite"></small>
                </label>

                <label class="input-with-icon">
                    <input id="register-email" type="email" name="email" placeholder="Email" autocomplete="email"
                        aria-describedby="register-email-error" />
                    <img class="input-icon" src="../assets/icons/mail.svg" alt="" />
                    <small id="register-email-error" class="field-error" aria-live="polite"></small>
                </label>

                <label class="input-with-icon">
                    <input id="register-password" type="password" name="password" placeholder="Password"
                        autocomplete="new-password" />
                    <button class="password-toggle" type="button" aria-label="Show password" disabled
                        data-visible-icon="../assets/icons/visibility.svg"
                        data-hidden-icon="../assets/icons/visibility_off.svg">
                        <img class="input-icon" src="../assets/icons/lock.svg" alt="" />
                    </button>
                    <small id="register-password-error" class="field-error" aria-live="polite"></small>
                </label>

                <label class="input-with-icon">
                    <input id="register-password-confirm" type="password" name="password-confirmation"
                        placeholder="Confirm Password" autocomplete="new-password"
                        aria-describedby="register-password-confirm-error" />
                    <button class="password-toggle" type="button" aria-label="Show password" disabled
                        data-visible-icon="../assets/icons/visibility.svg"
                        data-hidden-icon="../assets/icons/visibility_off.svg">
                        <img class="input-icon" src="../assets/icons/lock.svg" alt="" />
                    </button>
                    <small id="register-password-confirm-error" class="field-error" aria-live="polite"></small>
                </label>

                <label class="privacy-consent">
                    <input id="register-privacy" type="checkbox" name="privacy-consent"
                        aria-describedby="register-privacy-error" />
                    <span>I accept the Privacy policy</span>
                    <small id="register-privacy-error" class="field-error" aria-live="polite"></small>
                </label>

                <button id="register-submit" class="btn" type="submit" disabled>Sign up</button>
            </form>
        </section>
    </main>

    <footer class="login-footer">
        <a href="privacy-external.html">Datenschutzerklärung</a>
        <a href="legal-external.html">Legal notice</a>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="../scripts/register.js"></script>
</body>

</html>
